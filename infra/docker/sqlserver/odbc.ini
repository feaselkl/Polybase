; ODBC Data Source Name (DSN) registry. PolyBase's generic ODBC connector
; on Linux looks up DSNs in /etc/odbc.ini even when the external data
; source's CONNECTION_OPTIONS specifies Driver={...} inline. The block
; name here ([PostgresVolcano]) is what the SQL Server EDS references via
; CONNECTION_OPTIONS = 'DSN=PostgresVolcano;'.
;
; The Driver value must match a name registered in /etc/odbcinst.ini.
; The odbc-postgresql apt package adds 'PostgreSQL Unicode' (and ANSI).

[PostgresVolcano]
Driver = PostgreSQL Unicode
Servername = postgres
Port = 5432
Database = volcanodemo
